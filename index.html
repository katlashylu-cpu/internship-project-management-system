{% extends 'base.html' %}

{% block content %}
<h1>Project Dashboard</h1>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Title</th>
            <th>Student ID</th>
            <th>Created</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for project in projects %}
        <tr>
            <td>{{ project.title }}</td>
            <td>{{ project.student_id }}</td>
            <td>{{ project.created_at.strftime('%Y-%m-%d') }}</td>
            <td>
                <a href="{{ url_for('view_project', project_id=project.id) }}" class="btn btn-sm btn-primary">View</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
