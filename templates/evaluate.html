{% extends 'base.html' %}

{% block content %}
<h1>Evaluate Submission</h1>
<p><strong>Project:</strong> {{ submission.project.title }}</p>
<p><strong>Submission Version:</strong> {{ submission.version }}</p>
<form method="POST">
    <div class="mb-3">
        <label for="rubric_id" class="form-label">Select Rubric</label>
        <select class="form-control" id="rubric_id" name="rubric_id" required>
            {% for rubric in rubrics %}
            <option value="{{ rubric.id }}">{{ rubric.name }}</option>
            {% endfor %}
        </select>
    </div>
    <h3>Criteria</h3>
    <div id="evaluation-container">
        <!-- Criteria will be populated dynamically via JS or server-side -->
    </div>
    <button type="submit" class="btn btn-primary">Submit Evaluation</button>
</form>

<script>
$(document).ready(function() {
    $('#rubric_id').change(function() {
        const rubricId = $(this).val();
        $.get('/get_criteria/' + rubricId, function(data) {
            const container = $('#evaluation-container');
            container.empty();
            data.criteria.forEach(criterion => {
                container.append(`
                    <div class="mb-3">
                        <label class="form-label">${criterion.description} (Max: ${criterion.max_points})</label>
                        <input type="number" class="form-control" name="scores[]" max="${criterion.max_points}" min="0" required>
                        <label class="form-label">Comments</label>
                        <textarea class="form-control" name="comments[]"></textarea>
                    </div>
                `);
            });
        });
    });
});
</script>
{% endblock %}
