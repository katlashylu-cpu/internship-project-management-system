
{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Evaluate Submission</h1>

    <p><strong>Project:</strong> {{ submission.project.title }}</p>
    <p><strong>Submission Version:</strong> {{ submission.version }}</p>

    <form method="POST">
        <div class="mb-3">
            <label for="rubric_id" class="form-label">Select Rubric</label>

            <select class="form-select" id="rubric_id" name="rubric_id" required>
                {% for rubric in rubrics %}
                <option value="{{ rubric.id }}">{{ rubric.name }}</option>
                {% endfor %}
            </select>
        </div>

        <h3>Criteria</h3>

        <div id="evaluation-container">
            <p>Select a rubric to load its criteria.</p>
        </div>

        <button type="submit" class="btn btn-primary">
            Submit Evaluation
        </button>
    </form>
</div>

<script>
$(document).ready(function() {

    function loadCriteria() {
        const rubricId = $('#rubric_id').val();
        const container = $('#evaluation-container');

        container.empty();

        if (!rubricId) {
            container.html('<p>No rubric available.</p>');
            return;
        }

        $.get('/get_criteria/' + rubricId)
            .done(function(data) {
                if (!data.criteria || data.criteria.length === 0) {
                    container.html('<p>No criteria found for this rubric.</p>');
                    return;
                }

                data.criteria.forEach((criterion, index) => {
                    container.append(`
                        <div class="card mb-3">
                            <div class="card-body">
                                <label class="form-label">
                                    ${$('<div>').text(criterion.description).html()}
                                    (Max: ${criterion.max_points})
                                </label>

                                <input
                                    type="number"
                                    class="form-control mb-3"
                                    name="scores[]"
                                    min="0"
                                    max="${criterion.max_points}"
                                    step="1"
                                    required
                                >

                                <label class="form-label">Comments</label>
                                <textarea
                                    class="form-control"
                                    name="comments[]"
                                    rows="2"
                                ></textarea>
                            </div>
                        </div>
                    `);
                });
            })
            .fail(function() {
                container.html('<p class="text-danger">Unable to load criteria. Please try again.</p>');
            });
    }

    $('#rubric_id').on('change', loadCriteria);

    // Load criteria automatically when the page opens.
    loadCriteria();
});
</script>
{% endblock %}
